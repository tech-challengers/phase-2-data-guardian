openapi: 3.0.3
info:
  title: Data Guardian API
  description: Base OpenAPI definition for Data Guardian
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Server

paths:
  /api/v1/health:
    get:
      summary: Health check endpoint
      operationId: getHealthStatus
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/user-types:
    get:
      tags:
        - UserType
      summary: Get all user types
      operationId: listUserTypes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserType'
    post:
      tags:
        - UserType
      summary: Create a new user type
      operationId: createUserType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTypeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserType'

  /api/v1/user-types/{id}:
    get:
      tags:
        - UserType
      summary: Get user type by ID
      operationId: getUserTypeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserType'
        '404':
          description: Not Found
    put:
      tags:
        - UserType
      summary: Update a user type
      operationId: updateUserType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTypeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserType'
        '404':
          description: Not Found
    delete:
      tags:
        - UserType
      summary: Delete a user type
      operationId: deleteUserType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found

  /api/v1/users:
    get:
      tags:
        - User
      summary: Get all users
      operationId: listUsers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
    post:
      tags:
        - User
      summary: Create a newly user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /api/v1/users/{id}/type:
    put:
      tags:
        - User
      summary: Assign user type to user
      operationId: assignUserType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserTypeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Not Found

  /api/v1/restaurants/{restaurantId}/menu-items:
    get:
      tags:
        - MenuItem
      summary: List menu items of a restaurant
      operationId: listMenuItemsByRestaurant
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItemResponse'
    post:
      tags:
        - MenuItem
      summary: Create a menu item for a restaurant
      operationId: createMenuItem
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
        '400':
          description: Invalid data

  /api/v1/menu-items/{id}:
    get:
      tags:
        - MenuItem
      summary: Get menu item by ID
      operationId: getMenuItemById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
        '400':
          description: Not found or invalid
    put:
      tags:
        - MenuItem
      summary: Update a menu item
      operationId: updateMenuItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
        '400':
          description: Not found or invalid data
    delete:
      tags:
        - MenuItem
      summary: Delete a menu item
      operationId: deleteMenuItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content
        '400':
          description: Not found

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: UP
        timestamp:
          type: string
          format: date-time

    UserType:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Example "Dono de Restaurante" or "Cliente"

    UserTypeRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    UserRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        userType:
          $ref: '#/components/schemas/UserType'

    AssignUserTypeRequest:
      type: object
      required:
        - userTypeId
      properties:
        userTypeId:
          type: integer
          format: int64

    MenuItemRequest:
      type: object
      required:
        - name
        - price
        - dineInOnly
      properties:
        name:
          type: string
          minLength: 1
          example: Feijoada completa
        description:
          type: string
          example: Feijoada com arroz, couve e farofa
        price:
          type: number
          minimum: 0
          example: 49.90
        dineInOnly:
          type: boolean
          description: Available to order only at the restaurant
          example: false
        photoPath:
          type: string
          description: Path where the dish photo is stored
          example: /images/menu/feijoada.jpg

    MenuItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        restaurantId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
        dineInOnly:
          type: boolean
        photoPath:
          type: string