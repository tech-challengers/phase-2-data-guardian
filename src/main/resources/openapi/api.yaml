openapi: 3.0.3
info:
  title: Data Guardian API
  description: Base OpenAPI definition for Data Guardian
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Server

paths:
  /api/v1/health:
    get:
      summary: Health check endpoint
      operationId: getHealthStatus
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/restaurantes:
    get:
      tags:
        - Restaurante
      summary: Listar restaurantes
      operationId: findAllRestaurantes
      responses:
        '200':
          description: Restaurantes listados com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestauranteResponse'
    post:
      tags:
        - Restaurante
      summary: Criar restaurante
      operationId: criarRestaurante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestauranteRequest'
      responses:
        '201':
          description: Restaurante criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestauranteResponse'
        '400':
          description: Dados do restaurante inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /api/v1/restaurantes/{id}:
    get:
      tags:
        - Restaurante
      summary: Buscar restaurante por ID
      operationId: findRestauranteById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Restaurante encontrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestauranteResponse'
        '404':
          description: Restaurante não encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
    put:
      tags:
        - Restaurante
      summary: Atualizar restaurante
      operationId: updateRestaurante
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestauranteRequest'
      responses:
        '200':
          description: Restaurante atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestauranteResponse'
        '400':
          description: Dados do restaurante inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Restaurante não encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
    delete:
      tags:
        - Restaurante
      summary: Excluir restaurante
      operationId: deleteRestaurante
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Restaurante excluido com sucesso
        '400':
          description: Identificador do restaurante invalido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Restaurante nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate user and return JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /api/v1/user-types:
    get:
      tags:
        - UserType
      summary: Get all user types
      operationId: listUserTypes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserType'
    post:
      tags:
        - UserType
      summary: Create a new user type
      operationId: createUserType
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTypeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserType'

  /api/v1/user-types/{id}:
    get:
      tags:
        - UserType
      summary: Get user type by ID
      operationId: getUserTypeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserType'
        '404':
          description: Not Found
    put:
      tags:
        - UserType
      summary: Update a user type
      operationId: updateUserType
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTypeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserType'
        '404':
          description: Not Found
    delete:
      tags:
        - UserType
      summary: Delete a user type
      operationId: deleteUserType
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found

  /api/v1/users:
    get:
      tags:
        - User
      summary: Get all users
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
    post:
      tags:
        - User
      summary: Create a newly user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /api/v1/users/{id}/type:
    put:
      tags:
        - User
      summary: Assign user type to user
      operationId: assignUserType
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserTypeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Not Found

  /api/v1/restaurants/{restaurantId}/menu-items:
    get:
      tags:
        - MenuItem
      summary: List menu items of a restaurant
      operationId: listMenuItemsByRestaurant
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItemResponse'
    post:
      tags:
        - MenuItem
      summary: Create a menu item with image URL
      description: >
        Cria um item de menu recebendo os dados em JSON (incluindo opcionalmente photoPath como URL externa).
      operationId: createMenuItem
      security:
        - bearerAuth: []
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
        '400':
          description: Invalid data
        '401':
          description: Unauthorized
        '403':
          description: Only the restaurant owner can manage the menu
        '404':
          description: Restaurant not found

  /api/v1/restaurants/{restaurantId}/menu-items/with-photo:
    post:
      tags:
        - MenuItem
      summary: Create a menu item with image file upload
      description: >
        Cria um item de menu recebendo os dados em JSON (campo "data") e o arquivo de imagem
        (campo "photo") em uma única requisição multipart/form-data. A imagem é salva automaticamente
        no Supabase Storage e sua URL pública é persistida no item.
      operationId: createMenuItemWithPhoto
      security:
        - bearerAuth: []
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - data
                - photo
              properties:
                data:
                  type: string
                  description: JSON com os dados do item (nome, preço, dineInOnly, etc.)
                  example: '{"name":"Feijoada","description":"Completa","price":49.90,"dineInOnly":false}'
                photo:
                  type: string
                  format: binary
                  description: Arquivo de imagem para upload no Supabase Storage
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
        '400':
          description: Invalid data
        '401':
          description: Unauthorized
        '403':
          description: Only the restaurant owner can manage the menu
        '404':
          description: Restaurant not found

  /api/v1/menu-items/{id}:
    get:
      tags:
        - MenuItem
      summary: Get menu item by ID
      operationId: getMenuItemById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
        '404':
          description: Not Found
    put:
      tags:
        - MenuItem
      summary: Update a menu item
      operationId: updateMenuItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
        '400':
          description: Invalid data
        '401':
          description: Unauthorized
        '403':
          description: Only the restaurant owner can manage the menu
        '404':
          description: Not Found
    delete:
      tags:
        - MenuItem
      summary: Delete a menu item
      operationId: deleteMenuItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Only the restaurant owner can manage the menu
        '404':
          description: Not Found

  /api/v1/menu-items/{id}/photo:
    post:
      tags:
        - MenuItem
      summary: Upload or replace the photo of a menu item
      description: >
        Recebe a imagem via multipart/form-data, faz upload no Supabase Storage,
        persiste a URL pública no item e retorna o item atualizado.
        Se o item já possuía uma foto salva no storage, a foto anterior é excluída automaticamente.
      operationId: uploadMenuItemPhoto
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  format: binary
                  description: Arquivo de imagem (JPEG, PNG, WEBP, GIF)
      responses:
        '200':
          description: Foto enviada e item atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
        '400':
          description: Arquivo inválido ou ausente
        '401':
          description: Unauthorized
        '403':
          description: Only the restaurant owner can manage the menu
        '404':
          description: Menu item not found
    delete:
      tags:
        - MenuItem
      summary: Remove the photo of a menu item
      description: >
        Exclui a foto do Supabase Storage e limpa o campo photoPath do item de menu.
      operationId: deleteMenuItemPhoto
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Foto removida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
        '401':
          description: Unauthorized
        '403':
          description: Only the restaurant owner can manage the menu
        '404':
          description: Menu item not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErroResponse:
      type: object
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Dados do restaurante inválidos
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Nome é obrigatório
        instance:
          type: string
          example: /api/v1/restaurantes

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: UP
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: dono@restaurante.com
        password:
          type: string
          example: admin123

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          example: 86400000
        user:
          $ref: '#/components/schemas/UserResponse'

    UserType:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Example "DONO_DE_RESTAURANTE" or "CLIENTE"

    UserTypeRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    UserRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        userType:
          $ref: '#/components/schemas/UserType'

    AssignUserTypeRequest:
      type: object
      required:
        - userTypeId
      properties:
        userTypeId:
          type: integer
          format: int64

    RestauranteRequest:
      type: object
      required:
        - nome
        - endereco
        - gastronomia
        - horarioFuncionamento
      properties:
        nome:
          type: string
          minLength: 1
          example: Restaurante da Praça
        endereco:
          type: string
          minLength: 1
          example: Rua das Flores, 100
        gastronomia:
          type: string
          minLength: 1
          example: Brasileira
        horarioFuncionamento:
          type: string
          minLength: 1
          example: "11:00 às 22:00"
        donoId:
          type: integer
          format: int64
          minimum: 1
          example: 1

    RestauranteResponse:
      type: object
      required:
        - id
        - nome
        - endereco
        - gastronomia
        - horarioFuncionamento
      properties:
        id:
          type: integer
          format: int64
          example: 10
        nome:
          type: string
          example: Restaurante da Praça
        endereco:
          type: string
          example: Rua das Flores, 100
        gastronomia:
          type: string
          example: Brasileira
        horarioFuncionamento:
          type: string
          example: "11:00 às 22:00"

    MenuItemRequest:
      type: object
      required:
        - name
        - price
        - dineInOnly
      properties:
        name:
          type: string
          minLength: 1
          example: Feijoada completa
        description:
          type: string
          example: Feijoada com arroz, couve e farofa
        price:
          type: number
          minimum: 0
          example: 49.90
        dineInOnly:
          type: boolean
          description: Available to order only at the restaurant
          example: false
        photoPath:
          type: string
          description: Path where the dish photo is stored or URL
          example: /images/menu/feijoada.jpg

    MenuItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        restaurantId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
        dineInOnly:
          type: boolean
        photoPath:
          type: string
          description: URL pública da foto armazenada no Supabase Storage
