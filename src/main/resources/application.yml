spring:
  application:
    name: phase2-data-guardian

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_restaurante}?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ---------------------------------------------------------------------------
# Supabase Storage
# ---------------------------------------------------------------------------
# SUPABASE_URL             → URL base do projeto (ex: https://xyz.supabase.co)
# SUPABASE_KEY             → Chave de API (Service Role Key ou Anon Key)
# SUPABASE_STORAGE_BUCKET   → Nome do bucket de storage (default: menu-items)
# ---------------------------------------------------------------------------
supabase:
  url: ${SUPABASE_URL:https://test-project.supabase.co}
  key: ${SUPABASE_KEY:test-key}
  storage-bucket: ${SUPABASE_STORAGE_BUCKET:menu-items}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://phase2-data-guardian-mysql:3306/db_restaurante?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
